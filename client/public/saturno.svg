<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Cielo nocturno -->
    <radialGradient id="cielo" cx=".35" cy=".25" r=".95">
      <stop offset="0" stop-color="#3a2a85"/>
      <stop offset=".55" stop-color="#1c1450"/>
      <stop offset="1" stop-color="#0b0820"/>
    </radialGradient>
    <!-- Esfera: luz arriba a la izquierda, sombra violeta abajo -->
    <radialGradient id="esfera" cx=".32" cy=".28" r=".85">
      <stop offset="0" stop-color="#fff4fb"/>
      <stop offset=".3" stop-color="#e3c9ff"/>
      <stop offset=".65" stop-color="#9b6cf2"/>
      <stop offset="1" stop-color="#2e2275"/>
    </radialGradient>
    <linearGradient id="anillo" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#bdf0df" stop-opacity=".3"/>
      <stop offset=".35" stop-color="#ffd3d5"/>
      <stop offset=".7" stop-color="#f7e7ff"/>
      <stop offset="1" stop-color="#b18cf8" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b18cf8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#b18cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="noche" cx=".2" cy=".15" r="1.05">
      <stop offset=".55" stop-color="#170f40" stop-opacity="0"/>
      <stop offset="1" stop-color="#170f40" stop-opacity=".55"/>
    </radialGradient>
    <clipPath id="disco"><circle cx="32" cy="33" r="13"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#cielo)"/>

  <!-- Órbita tenue y estrellas -->
  <circle cx="32" cy="33" r="27" fill="none" stroke="#c9b8ff" stroke-opacity=".18" stroke-width=".6" stroke-dasharray="1.2 3.2"/>
  <circle cx="13" cy="13" r=".9" fill="#fff" opacity=".8"/>
  <circle cx="22" cy="7.5" r=".6" fill="#fff" opacity=".55"/>
  <circle cx="56" cy="47" r=".7" fill="#fff" opacity=".6"/>
  <circle cx="45" cy="57" r=".5" fill="#fff" opacity=".45"/>
  <circle cx="7" cy="30" r=".6" fill="#fff" opacity=".5"/>
  <!-- Destellos de cuatro puntas -->
  <path d="M51 6.5Q51.6 11.4 56.5 12Q51.6 12.6 51 17.5Q50.4 12.6 45.5 12Q50.4 11.4 51 6.5Z" fill="#fff4fb"/>
  <path d="M15 49Q15.3 51.7 18 52Q15.3 52.3 15 55Q14.7 52.3 12 52Q14.7 51.7 15 49Z" fill="#ffd3d5" opacity=".85"/>

  <!-- Halo -->
  <circle cx="32" cy="33" r="22" fill="url(#halo)"/>

  <!-- Mitad trasera de los anillos (queda detrás del planeta) -->
  <g transform="rotate(-18 32 33)" fill="none">
    <ellipse cx="32" cy="33" rx="25" ry="7" stroke="url(#anillo)" stroke-width="2.4" opacity=".45"/>
    <ellipse cx="32" cy="33" rx="20" ry="5.4" stroke="#f7e7ff" stroke-width=".8" opacity=".35"/>
  </g>

  <!-- Planeta con bandas -->
  <circle cx="32" cy="33" r="13" fill="url(#esfera)"/>
  <g clip-path="url(#disco)" transform="rotate(-18 32 33)" fill="none" stroke="#fff4fb">
    <ellipse cx="32" cy="29" rx="16" ry="2.2" stroke-width="1.1" opacity=".28"/>
    <ellipse cx="32" cy="35.5" rx="16" ry="2.6" stroke-width="1.6" opacity=".16"/>
    <ellipse cx="32" cy="40" rx="16" ry="2" stroke-width=".8" opacity=".2"/>
  </g>
  <!-- Sombra del lado nocturno -->
  <circle cx="32" cy="33" r="13" fill="url(#noche)"/>

  <!-- Mitad delantera de los anillos (pasa por delante) -->
  <g fill="none" stroke-linecap="round">
    <path d="M8.22 40.73A25 7 -18 0 0 55.78 25.27" stroke="url(#anillo)" stroke-width="2.4"/>
    <path d="M12.98 39.18A20 5.4 -18 0 0 51.02 26.82" stroke="#f7e7ff" stroke-width=".8" opacity=".7"/>
  </g>
</svg>
